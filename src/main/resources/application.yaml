spring:
  application:
    name: trade-engine

  datasource:
    url: jdbc:postgresql://localhost:5432/tradeengine
    username: tradeuser
    password: tradepass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: trade-processor-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: "com.tradeengine.trade_engine.*"
        spring.json.value.default.type: "com.tradeengine.trade_engine.events.TradeRequestedEvent"
    template:
      default-topic: trade-requests

  batch:
    jdbc:
      initialize-schema: always
      schema: classpath:org/springframework/batch/core/schema-postgresql.sql
    job:

      enabled: false

logging:
  level:
    com.tradeengine.trade_engine: DEBUG
    org.springframework.kafka: INFO
    org.springframework.batch: INFO